<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SYSTEM LOCKED</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Courier New', monospace;
        color: #00ff41;
        cursor: none;
    }

    #lockScreen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: radial-gradient(ellipse at center, #0a0a0a 0%, #000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        animation: flicker 3s infinite;
    }

    @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.7; }
        94% { opacity: 1; }
        96% { opacity: 0.85; }
        97% { opacity: 1; }
    }

    .glitch {
        font-size: 2.2rem;
        font-weight: 900;
        color: #ff0033;
        text-shadow:
            0 0 10px #ff0033,
            0 0 20px #ff0033,
            2px 2px 0 #000,
            -2px -2px 0 #000;
        letter-spacing: 4px;
        margin-bottom: 20px;
        position: relative;
        animation: glitchAnim 1.5s infinite;
    }

    @keyframes glitchAnim {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        60% { transform: translate(-1px, -1px); }
        80% { transform: translate(1px, 1px); }
    }

    .skull {
        font-size: 5rem;
        margin-bottom: 20px;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #ff0033); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 30px #ff0033); }
    }

    .warning-text {
        font-size: 1rem;
        color: #00ff41;
        line-height: 1.8;
        max-width: 500px;
        margin-bottom: 30px;
        text-shadow: 0 0 5px #00ff41;
    }

    .warning-text .red {
        color: #ff0033;
        font-weight: bold;
    }

    .counter {
        font-size: 4rem;
        font-weight: 900;
        color: #ff0033;
        text-shadow: 0 0 20px #ff0033;
        margin: 20px 0;
        font-family: 'Courier New', monospace;
    }

    .terminal {
        background: #0a0a0a;
        border: 1px solid #00ff41;
        border-radius: 8px;
        padding: 15px;
        width: 100%;
        max-width: 500px;
        text-align: left;
        font-size: 0.75rem;
        color: #00ff41;
        height: 150px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }

    .terminal-line {
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
    }

    .terminal-line .time {
        color: #666;
        margin-right: 8px;
    }

    .terminal-line .err {
        color: #ff0033;
    }

    .terminal-line .ok {
        color: #00ff41;
    }

    .progress-bar {
        width: 100%;
        max-width: 500px;
        height: 20px;
        background: #1a0000;
        border: 1px solid #ff0033;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff0033, #ff6600);
        width: 0%;
        transition: width 0.5s;
        box-shadow: 0 0 15px #ff0033;
    }

    .progress-text {
        font-size: 0.8rem;
        color: #ff0033;
        margin-bottom: 10px;
    }

    .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
    }

    .btn {
        padding: 12px 24px;
        background: #1a0000;
        border: 1px solid #ff0033;
        color: #ff0033;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn:hover, .btn:active {
        background: #ff0033;
        color: #000;
        box-shadow: 0 0 20px #ff0033;
    }

    .btn.hidden {
        display: none;
    }

    #unlockScreen {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #000;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
        text-align: center;
    }

    #unlockScreen.show {
        display: flex;
    }

    .unlock-title {
        font-size: 2rem;
        color: #00ff41;
        margin-bottom: 20px;
        text-shadow: 0 0 15px #00ff41;
    }

    .unlock-input {
        padding: 15px;
        font-size: 1.2rem;
        background: #0a0a0a;
        border: 2px solid #00ff41;
        border-radius: 8px;
        color: #00ff41;
        text-align: center;
        font-family: 'Courier New', monospace;
        width: 100%;
        max-width: 300px;
        margin-bottom: 20px;
        outline: none;
        letter-spacing: 4px;
    }

    .unlock-hint {
        color: #666;
        font-size: 0.8rem;
        margin-top: 15px;
    }

    /* Блокировка свайпов/жестов */
    body {
        touch-action: none;
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        height: 100%;
    }

    /* Адаптив */
    @media (max-width: 480px) {
        .glitch { font-size: 1.6rem; letter-spacing: 2px; }
        .skull { font-size: 3.5rem; }
        .counter { font-size: 2.5rem; }
        .warning-text { font-size: 0.85rem; }
        .btn { padding: 10px 16px; font-size: 0.75rem; }
        .terminal { height: 100px; font-size: 0.65rem; }
    }
</style>
</head>
<body>

<!-- ЭКРАН БЛОКИРОВКИ -->
<div id="lockScreen">
    <div class="skull">💀</div>
    <div class="glitch">SYSTEM LOCKED</div>

    <div class="warning-text">
        <span class="red">⚠ ВНИМАНИЕ ⚠</span><br>
        Ваше устройство заблокировано.<br>
        Все данные зашифрованы.<br>
        Для разблокировки введите код.
    </div>

    <div class="counter" id="countdown">10</div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">Шифрование: 0%</div>

    <div class="terminal" id="terminal">
        <div class="terminal-line"><span class="time">[00:00:01]</span><span class="err">Запуск шифрования...</span></div>
    </div>

    <div class="buttons">
        <button class="btn" id="unlockBtn">🔓 Разблокировать</button>
        <button class="btn" id="exitBtn">❌ Выйти</button>
    </div>
</div>

<!-- ЭКРАН РАЗБЛОКИРОВКИ -->
<div id="unlockScreen">
    <div class="unlock-title">🔐 ВВЕДИТЕ КОД</div>
    <input type="password" class="unlock-input" id="unlockInput" placeholder="••••" maxlength="8">
    <button class="btn" id="confirmUnlock">Подтвердить</button>
    <div class="unlock-hint">Подсказка: код — <span id="hintCode">1234</span></div>
</div>

<script>
// ============================================
// LOCKER — HTML ВИНЛОКЕР
// ============================================

(function() {
    'use strict';

    // ===== КОНФИГ =====
    const CONFIG = {
        unlockCode: '1234',        // Код для разблокировки
        countdownFrom: 10,          // Начальный отсчёт
        encryptionSpeed: 50,        // Скорость "шифрования" (мс)
        terminalSpeed: 800,         // Скорость вывода строк (мс)
        showHint: true              // Показывать подсказку с кодом
    };

    // ===== ЭЛЕМЕНТЫ =====
    const lockScreen = document.getElementById('lockScreen');
    const unlockScreen = document.getElementById('unlockScreen');
    const countdownEl = document.getElementById('countdown');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const terminal = document.getElementById('terminal');
    const unlockBtn = document.getElementById('unlockBtn');
    const exitBtn = document.getElementById('exitBtn');
    const unlockInput = document.getElementById('unlockInput');
    const confirmUnlock = document.getElementById('confirmUnlock');
    const hintCode = document.getElementById('hintCode');

    // ===== СОСТОЯНИЕ =====
    let countdown = CONFIG.countdownFrom;
    let encryptionProgress = 0;
    let countdownInterval;
    let encryptionInterval;
    let terminalInterval;

    // ===== ТЕРМИНАЛ — СООБЩЕНИЯ =====
    const terminalMessages = [
        { text: 'Инициализация протокола шифрования...', type: 'ok' },
        { text: 'Сканирование файловой системы...', type: 'ok' },
        { text: 'Найдено 4 837 файлов', type: 'ok' },
        { text: 'Шифрование /storage/DCIM...', type: 'err' },
        { text: 'Шифрование /storage/WhatsApp...', type: 'err' },
        { text: 'Шифрование /storage/Telegram...', type: 'err' },
        { text: 'Шифрование /storage/Downloads...', type: 'err' },
        { text: 'Генерация ключа AES-256...', type: 'ok' },
        { text: 'Ключ: 8f3a9c2e1b7d4f6a...', type: 'ok' },
        { text: 'Отправка ключа на сервер...', type: 'err' },
        { text: 'Ключ отправлен ✓', type: 'err' },
        { text: 'Файлы зашифрованы. Доступ закрыт.', type: 'err' },
        { text: 'Требуется код разблокировки.', type: 'err' }
    ];

    let terminalIndex = 0;

    // ===== ПОДСКАЗКА =====
    if (CONFIG.showHint) {
        hintCode.textContent = CONFIG.unlockCode;
    } else {
        document.querySelector('.unlock-hint').style.display = 'none';
    }

    // ===== ЗАПУСК ОБРАТНОГО ОТСЧЁТА =====
    function startCountdown() {
        countdownInterval = setInterval(() => {
            countdown--;
            if (countdown >= 0) {
                countdownEl.textContent = countdown;
            }
            if (countdown <= 0) {
                countdownEl.textContent = '💀';
                clearInterval(countdownInterval);
            }
        }, 1000);
    }

    // ===== ЗАПУСК "ШИФРОВАНИЯ" =====
    function startEncryption() {
        encryptionInterval = setInterval(() => {
            encryptionProgress += Math.random() * 8 + 2;
            if (encryptionProgress >= 100) {
                encryptionProgress = 100;
                clearInterval(encryptionInterval);
                progressText.textContent = '✅ Файлы зашифрованы';
            } else {
                progressText.textContent = `Шифрование: ${Math.floor(encryptionProgress)}%`;
            }
            progressFill.style.width = encryptionProgress + '%';
        }, CONFIG.encryptionSpeed);
    }

    // ===== ЗАПУСК ТЕРМИНАЛА =====
    function startTerminal() {
        terminalInterval = setInterval(() => {
            if (terminalIndex >= terminalMessages.length) {
                clearInterval(terminalInterval);
                return;
            }
            const msg = terminalMessages[terminalIndex];
            const now = new Date();
            const time = `[${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}]`;
            
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerHTML = `<span class="time">${time}</span><span class="${msg.type}">${msg.text}</span>`;
            terminal.appendChild(line);

            // Автоскролл
            terminal.scrollTop = terminal.scrollHeight;

            // Ограничение строк
            while (terminal.children.length > 8) {
                terminal.removeChild(terminal.firstChild);
            }

            terminalIndex++;
        }, CONFIG.terminalSpeed);
    }

    // ===== ЗАПУСК ВСЕГО =====
    function start() {
        startCountdown();
        startEncryption();
        startTerminal();
    }

    // ===== РАЗБЛОКИРОВКА =====
    unlockBtn.addEventListener('click', () => {
        lockScreen.style.display = 'none';
        unlockScreen.classList.add('show');
        unlockInput.focus();

        // Останавливаем таймеры
        clearInterval(countdownInterval);
        clearInterval(encryptionInterval);
        clearInterval(terminalInterval);
    });

    // ===== ПОДТВЕРЖДЕНИЕ КОДА =====
    confirmUnlock.addEventListener('click', () => {
        const code = unlockInput.value.trim();
        if (code === CONFIG.unlockCode) {
            alert('✅ Доступ разрешён. Устройство разблокировано.');
            unlockScreen.classList.remove('show');
            lockScreen.style.display = 'flex';
            // Перезапуск
            location.reload();
        } else {
            unlockInput.style.borderColor = '#ff0000';
            unlockInput.value = '';
            unlockInput.placeholder = 'НЕВЕРНЫЙ КОД';
            setTimeout(() => {
                unlockInput.style.borderColor = '#00ff41';
                unlockInput.placeholder = '••••';
            }, 1500);
        }
    });

    // Enter для разблокировки
    unlockInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') confirmUnlock.click();
    });

    // ===== КНОПКА ВЫХОДА =====
    exitBtn.addEventListener('click', () => {
        if (confirm('Вы уверены? Файлы останутся зашифрованными!')) {
            alert('Шутка! Это HTML-страница, а не реальный вирус 😄');
            // Попытка закрыть вкладку (работает не всегда)
            window.close();
            // Или редирект
            // window.location.href = 'about:blank';
        }
    });

    // ===== БЛОКИРОВКА ЖЕСТОВ/КНОПОК =====
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());

    // Блокировка клавиш (F5, Ctrl+W, Alt+F4 и т.д.)
    document.addEventListener('keydown', (e) => {
        // F5, Ctrl+R — обновление
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+W — закрыть вкладку
        if (e.ctrlKey && e.key === 'w') {
            e.preventDefault();
            return false;
        }
        // Ctrl+T — новая вкладка
        if (e.ctrlKey && e.key === 't') {
            e.preventDefault();
            return false;
        }
        // Escape
        if (e.key === 'Escape') {
            e.preventDefault();
            return false;
        }
    });

    // Блокировка свайпа назад (мобильные)
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', () => {
        history.pushState(null, null, location.href);
    });

    // Блокировка жестов (пинч, свайп)
    document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });

    // ===== ЗАПУСК ПРИ ЗАГРУЗКЕ =====
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }

    // ===== ПОЛНОЭКРАННЫЙ РЕЖИМ (по клику) =====
    document.body.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
        }
    }, { once: true });

})();
</script>
</body>
  </html>
